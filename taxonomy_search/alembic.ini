# Alembic configuration for the auction_search schema.
#
# The database URL is NOT stored here: migrations/env.py builds it from DB_* environment
# variables / .env (see .env.example). Migrations are never run automatically — run them by hand:
#
#   .venv/bin/alembic upgrade head --sql     # preview the SQL, nothing is executed
#   .venv/bin/alembic upgrade head           # apply
#   .venv/bin/alembic current                # show the applied revision

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
