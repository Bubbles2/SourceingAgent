# Example seed taxonomy — Phase 2.
#
# Hand-authored starting point, NOT yet reviewed by a domain expert. It is loaded with
# review_status "candidate" unless `load-taxonomy --approve` is given, and only becomes visible to
# search when its version is published.
#
# Format (validated by `python -m auction_search.cli validate-taxonomy`):
#   concepts:            list of concepts
#     key:               stable id, lower-case dotted path (e.g. fashion.footwear.boots)
#     dimension:         category | subcategory | object_type | period | style | region |
#                        material | technique | maker
#     labels:            preferred label per language (fr and en required)
#     synonyms / spelling_variants / abbreviations / hidden:  {language: [terms]}
#                        A term is a string or {text: ..., ambiguous: true}. Ambiguous terms are
#                        not used alone for classification (e.g. French "or" = gold / "or" = now).
#     broader:           list of parent concept keys ("broader" relationships)
#     years:             [start, end] (either may be null) for periods, makers' lives, etc.
#     note:              {language: scope note}
#     attributes:        free-form object (e.g. maker kind)
#   relationships:       [source key, relationship type, target key] (+ optional note)
#   source_categories:   Drouot categories (lots.category_fr / category_en) → concepts.
#                        map: a key (= classified_as) or {assertion: key}; confidence optional.
#
# Labels for categories, subcategories and object types are plural (as in Drouot and the Getty AAT);
# singular/plural matching is the matcher's job (Phase 3), not the taxonomy's.

